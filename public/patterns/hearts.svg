<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
	<!--
		A scatter tile for the intro bands. Hearts carry the idea; the dots and
		four-point sparkles are what stop a field of nothing but hearts reading as
		clip art.

		Nine elements, down from fifteen, at the client's request. The cut fell
		hardest on the hearts and sparkles she named — five hearts to three and
		three sparkles to two — with the dots thinned only enough to keep the mix
		from tipping back into the plain dot field this replaced.

		Nothing here is on a grid. The positions are hand-placed and deliberately
		avoid rows, columns and even spacing, because the tile is repeated and any
		alignment inside it turns into a visible lattice across the band. They are
		also checked as a torus: two elements a comfortable distance apart inside
		the square can still collide once the tile is laid next to itself.

		This is used as a CSS mask, not as a picture, so the fill here is never
		seen: the colour is whatever `.heart-field` is told to be, which is how one
		tile can be warm gold on the paper bands and a plain tint on the shop's five
		coloured ones. White rather than black because `mask-mode` is left at
		`match-source` — white shows under either reading of that, where black
		would vanish entirely if a browser chose luminance.
	-->
	<defs>
		<path
			id="h"
			d="M5 9C5 9 0 5.5 0 2.8 0 1.1 1.2 0 2.6 0 3.7 0 4.6.7 5 1.5 5.4.7 6.3 0 7.4 0 8.8 0 10 1.1 10 2.8 10 5.5 5 9 5 9Z" />
		<path
			id="s"
			d="M6 0C6.6 3.4 8.6 5.4 12 6 8.6 6.6 6.6 8.6 6 12 5.4 8.6 3.4 6.6 0 6 3.4 5.4 5.4 3.4 6 0Z" />
	</defs>

	<g fill="#fff">
		<use href="#h" transform="translate(40 34) rotate(-14) scale(1.3) translate(-5 -4.5)" />
		<use href="#h" transform="translate(158 96) rotate(11) scale(1.5) translate(-5 -4.5)" />
		<use href="#h" transform="translate(66 150) rotate(-21) scale(1) translate(-5 -4.5)" />

		<use href="#s" transform="translate(120 30) scale(.8) translate(-6 -6)" />
		<use href="#s" transform="translate(196 172) scale(.7) translate(-6 -6)" />

		<circle cx="86" cy="88" r="2.4" />
		<circle cx="200" cy="52" r="1.8" />
		<circle cx="16" cy="110" r="2.8" />
		<circle cx="134" cy="204" r="2" />
	</g>
</svg>
